name: Refresh property feed

# The source site asks for a 33-second crawl delay in robots.txt, which the
# scraper honours. A full pass over ~76 listings in two languages therefore
# takes well over an hour — too long for a serverless function, which is why
# this runs here rather than on Netlify.

on:
  schedule:
    - cron: '20 3 * * *' # 03:20 UTC daily, before Andorran office hours
  workflow_dispatch:
    inputs:
      crawl_delay_ms:
        description: 'Delay between requests in ms (default 33000)'
        required: false
        default: '33000'
      languages:
        description: 'Comma-separated languages to ingest'
        required: false
        default: 'ca,en'

concurrency:
  group: roc-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scraper/package.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm install --no-audit --no-fund

      - name: Crawl and upsert
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ROC_CRAWL_DELAY_MS: ${{ github.event.inputs.crawl_delay_ms || '33000' }}
          ROC_LANGS: ${{ github.event.inputs.languages || 'ca,en' }}
        run: node src/index.js

      # The editorial content — news, the standing pages — is versioned in the
      # repo rather than stored in the database, so a change arrives as a
      # commit. Netlify builds on push, which also covers the listings.
      - name: Refresh news and standing pages
        working-directory: scraper
        env:
          ROC_CRAWL_DELAY_MS: ${{ github.event.inputs.crawl_delay_ms || '33000' }}
        run: |
          node src/scrape-news.js --out roc-news.json
          node src/scrape-pages.js --out roc-pages.json

      - name: Commit any editorial change
        id: commit
        run: |
          git config user.name  "roc-scraper[bot]"
          git config user.email "roc-scraper[bot]@users.noreply.github.com"
          git add scraper/roc-news.json scraper/roc-pages.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No editorial change."
          else
            git commit -m "Refresh news and standing pages"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Only needed when nothing was pushed; a push builds on its own.
      - name: Rebuild the site
        if: success() && steps.commit.outputs.changed == 'false'
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$NETLIFY_BUILD_HOOK" ]; then curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK"; fi
